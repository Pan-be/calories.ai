security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: users
            access_token:
                token_handler: App\Security\ApiTokenHandler
                failure_handler: App\Security\JsonEntryPoint
            entry_point: App\Security\JsonEntryPoint

    access_control:
        - { path: ^/api/(auth/(login|register)|health)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
